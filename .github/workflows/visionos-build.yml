# Vérifie que le projet visionOS compile pour le simulateur (sans signature).
name: visionOS build

on:
  push:
    paths:
      - "visionOS/**"
      - ".github/workflows/visionos-build.yml"
  pull_request:
    paths:
      - "visionOS/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # "default" = Xcode par défaut du runner ; "latest" = Xcode le plus récent installé.
        xcode: [default, latest]
        swift: [projet]
        include:
          # Réglages d'un projet créé avec le modèle visionOS d'Xcode 26
          # (cas d'un import du donjon dans un nouveau projet « TORIX360 »).
          - xcode: latest
            swift: modele-xcode26
            extra: >-
              SWIFT_DEFAULT_ACTOR_ISOLATION=MainActor
              SWIFT_APPROACHABLE_CONCURRENCY=YES
              SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY=YES
    steps:
      - uses: actions/checkout@v4

      - name: Choisir Xcode
        if: matrix.xcode == 'latest'
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Xcode sélectionné : $LATEST"
          sudo xcode-select -s "$LATEST"

      - name: Xcode et SDK disponibles
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i xr || true
          xcrun simctl list runtimes | grep -i vision || true

      - name: Build simulateur visionOS
        working-directory: visionOS
        run: |
          set -o pipefail
          xcodebuild \
            -project TorixDungeon.xcodeproj \
            -scheme TorixDungeon \
            -configuration Debug \
            -destination 'generic/platform=visionOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ${{ matrix.extra }} \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

  # Lance réellement l'app dans un simulateur visionOS et vérifie qu'elle ne plante pas au démarrage.
  smoke-test:
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # "corrige" : l'app doit tourner. "temoin-ancien-role" : on remet l'ancien rôle de scène
        # (fenêtre 2D) dans l'app construite ; elle DOIT planter, sinon le test ne prouve rien.
        variante: [corrige, temoin-ancien-role]
    name: smoke-test (${{ matrix.variante }})
    steps:
      - uses: actions/checkout@v4

      - name: Choisir le Xcode le plus récent
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Créer et démarrer un simulateur Apple Vision Pro
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if 'xrOS' in x['identifier'] and x['isAvailable']]; print(sorted(r, key=lambda x: [int(p) for p in x['version'].split('.')])[-1]['identifier'])")
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; print([d['identifier'] for d in json.load(sys.stdin)['devicetypes'] if 'Vision' in d['name']][0])")
          echo "Runtime : $RUNTIME / Appareil : $DEVICE_TYPE"
          UDID=$(xcrun simctl create "CI Vision Pro" "$DEVICE_TYPE" "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build pour ce simulateur
        working-directory: visionOS
        run: |
          set -o pipefail
          xcodebuild -project TorixDungeon.xcodeproj -scheme TorixDungeon -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build \
            2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Vérifier le rôle de scène dans l'Info.plist construit
        working-directory: visionOS
        run: |
          APP=$(find build/Build/Products -name 'TorixDungeon.app' -maxdepth 3 | head -1)
          ROLE=$(/usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UIApplicationPreferredDefaultSceneSessionRole' "$APP/Info.plist")
          echo "Rôle de scène par défaut : $ROLE"
          codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier" || true
          # La fenêtre principale est un volume : tout autre rôle fait planter l'app au lancement.
          test "$ROLE" = "UIWindowSceneSessionRoleVolumetricApplication"

      - name: Lancer l'app et vérifier qu'elle tourne encore après 30 s
        working-directory: visionOS
        run: |
          APP=$(find build/Build/Products -name 'TorixDungeon.app' -maxdepth 3 | head -1)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")

          # Témoin : si même une app système ne se lance pas, le simulateur sans écran
          # de la CI ne sait pas lancer d'apps et le test n'est pas concluant.
          if ! xcrun simctl launch "$UDID" com.apple.Preferences; then
            echo "::warning::Le simulateur de la CI ne lance aucune app (même Réglages) : test de lancement non concluant."
            exit 0
          fi
          xcrun simctl terminate "$UDID" com.apple.Preferences || true

          if [ "${{ matrix.variante }}" = "temoin-ancien-role" ]; then
            /usr/libexec/PlistBuddy -c 'Set :UIApplicationSceneManifest:UIApplicationPreferredDefaultSceneSessionRole UIWindowSceneSessionRoleApplication' "$APP/Info.plist"
            codesign --force --sign - "$APP"
            EXPECT=crash
          else
            EXPECT=running
          fi

          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch --stdout="$PWD/launch.log" --stderr="$PWD/launch.log" "$UDID" "$BUNDLE_ID" || echo "simctl launch a échoué"
          sleep 30
          echo "--- Sortie de l'app ---"; cat launch.log || true

          if xcrun simctl spawn "$UDID" launchctl list | grep "$BUNDLE_ID" | awk '{print $1}' | grep -qE '^[0-9]+$'; then
            RESULT=running
          else
            RESULT=crash
          fi
          echo "Attendu : $EXPECT / Obtenu : $RESULT"
          if [ "$RESULT" != "$EXPECT" ]; then
            echo "::error::Résultat inattendu (attendu $EXPECT, obtenu $RESULT)"
            find ~/Library/Logs/DiagnosticReports -name 'TorixDungeon*' -newer build.log -exec head -60 {} \; 2>/dev/null || true
            exit 1
          fi

      - name: Capture d'écran du simulateur
        if: always()
        run: xcrun simctl io "$UDID" screenshot visionOS/simulateur.png || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-${{ matrix.variante }}
          path: |
            visionOS/simulateur.png
            visionOS/launch.log
